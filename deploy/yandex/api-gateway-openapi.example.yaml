openapi: 3.0.0
info:
  title: horroreiro-staging-gateway
  version: 1.0.0

# Replace <container-id> with the Serverless Container ID.
# Replace <service-account-id> with the real service account ID, for example aje...
# Do not leave angle-bracket placeholders in the deployed spec.
# The service account must have serverless-containers.containerInvoker for the target container.
# The account/user creating the gateway must also be allowed to use this service account.
x-yc-apigateway:
  service_account_id: <service-account-id>

paths:
  /:
    x-yc-apigateway-any-method:
      summary: Proxy root to Horroreiro container
      operationId: proxyRoot
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: <container-id>

  /{proxy+}:
    x-yc-apigateway-any-method:
      summary: Proxy all routes to Horroreiro container
      operationId: proxyAnyRoute
      parameters:
        - name: proxy
          in: path
          required: false
          schema:
            type: string
            default: "-"
          style: simple
          explode: false
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: <container-id>
