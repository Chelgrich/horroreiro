<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компания — Хоррорейро</title>

  <meta name="description" content="Карточка компании в Хоррорейро: фильмы по ролям производства и дистрибуции.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111315">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://uogzcozbnosfguyfbvhe.supabase.co" crossorigin>

  <link data-app-fonts media="print" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <style>
    html { background: #111315; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #111315; color: #f2f2f2; }
    html:not(.app-styles-ready) .page,
    html:not(.app-styles-ready) #sharedFooterMount { display: none; }
    #sharedHeaderMount:empty { min-height: 56px; }
    #appStartupError {
      display: none;
      margin: 0;
      padding: 12px 24px;
      color: #ffd9d4;
      text-align: center;
      font: 14px/1.45 system-ui, sans-serif;
    }
    html.app-load-failed #appStartupError { display: block; }
    html.app-load-failed .page-content-skeleton,
    html.app-load-failed .movie-page-stack-skeleton { display: none; }
  </style>

  <script src="/boot-loader.js?v=30"></script>
</head>

<body data-app-page="company">
  <p id="appStartupError" role="status">Не удалось загрузить страницу. Обновите её.</p>

  <main class="page company-page-shell">
    <div id="sharedHeaderMount"></div>

    <div id="sharedAuthModalMount"></div>

    <div id="sharedDisplayNameModalMount"></div>

    <section class="section company-page">
      <a href="/" class="secondary-button user-page-back-link"><span class="back-link-arrow" aria-hidden="true">←</span><span>Назад в каталог</span></a>

      <div id="companyPage" class="company-page-content-shell">
        <div class="company-page-loading-state page-content-skeleton" role="status" aria-label="Загрузка компании..."></div>
      </div>
    </section>
  </main>

  <div id="sharedFooterMount"></div>

  <script src="/page-warm-start.js?v=27"></script>


  <script src="/app-script-loader.js?v=27"></script>
</body>

</html>
