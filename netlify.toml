[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/movie/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/user/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/name/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/company/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/following"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/notifications"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/editor"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/directors"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/production"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/distributors"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/russian-distributors"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/env"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/app-assets/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/env"
  to = "/.netlify/functions/env"
  status = 200

[[redirects]]
  from = "/app-assets/:version"
  to = "/.netlify/functions/app-assets"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/profile-activity-ranks/:userId"
  to = "/.netlify/functions/profile-activity-ranks?userId=:userId"
  status = 200

[[redirects]]
  from = "/admin/users/:userId/password"
  to = "/.netlify/functions/admin-user-password?userId=:userId"
  status = 200

[[redirects]]
  from = "/movie/:slug"
  to = "/.netlify/functions/movie?route=detail&slug=:slug"
  status = 200

[[redirects]]
  from = "/movie.html"
  to = "/.netlify/functions/movie"
  status = 200

[[redirects]]
  from = "/user/*"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/following"
  to = "/following.html"
  status = 200

[[redirects]]
  from = "/notifications"
  to = "/notifications.html"
  status = 200

[[redirects]]
  from = "/editor"
  to = "/editor.html"
  status = 200

[[redirects]]
  from = "/directors"
  to = "/directors.html"
  status = 200

[[redirects]]
  from = "/name/*"
  to = "/name.html"
  status = 200

[[redirects]]
  from = "/production"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/production.html"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/distributors"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/distributors.html"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/russian-distributors"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/russian-distributors.html"
  to = "/companies.html"
  status = 200

[[redirects]]
  from = "/company/*"
  to = "/company.html"
  status = 200
